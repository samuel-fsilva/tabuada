<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabuada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=SUSE:wght@100..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div><h1>TABUADA</h1></div>
    </header>
    <main>
      <div id="calc-body">
        <div id="grid-area">
          <div>
            <label for="number-multiplication-table"
              >Qual é o número que você quer a tabuada?</label
            ><input
              type="number"
              name=""
              id="number-multiplication-table"
              placeholder="Digite o número da tabuada"
            />
          </div>
          <div>
            <label for="max-multiplication-table"
              >Até que número você quer? </label
            ><br /><input
              type="number"
              name=""
              id="max-multiplication-table"
              placeholder="Até que número calcular?"
            />
          </div>
          <div id="button-area">
            <button id="calculate">Calcular</button>
            <button id="pdf-generator">Gerar PDF</button>
            <button id="clean">
              <img
                src="images/free-refresh-icon-3104-thumb.png"
                alt=""
              />
            </button>
          </div>
          <div id="result-output"></div>
        </div>
      </div>
    </main>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"
      integrity="sha512-MpDFIChbcXl2QgipQrt1VcPHMldRILetapBl5MPCA9Y8r7qvlwx1/Mc9hNTzY+kS5kX6PdoDq41ws1HiVNLdZA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
